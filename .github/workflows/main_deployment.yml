name: CI/CD Pipeline Backend Portal

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment: DB_Setting

    steps:
    # 1. Mengambil salinan kode sumber dari repositori [cite: 99]
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Melakukan autentikasi ke platform Cloud (AWS) [cite: 100]
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # Login ke Container Registry
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    # 3. Membangun image Docker dan mengirimkannya [cite: 101]
    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.SERVICE_NAME }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    # 4. Deploy ke Serverless Container (AWS ECS Fargate)
    - name: Download task definition
      run: |
        aws ecs describe-task-definition --task-definition fargate-portal-task --query taskDefinition > task-definition.json
        # Baris baru: Menghapus parameter 'enableFaultInjection' yang tidak didukung oleh proses render
        jq 'del(.enableFaultInjection)' task-definition.json > clean-task-def.json && mv clean-task-def.json task-definition.json

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: backend-app  
        image: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.SERVICE_NAME }}:${{ github.sha }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2 # <-- Naikkan versi ke v2 di sini
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: fargate-portal-task-service-rfnoythr
        cluster: portal-cluster-modul6
        wait-for-service-stability: true